name: FNA Android Build

env:
  SDL_VERSION: release-3.4.4
  SDL2COMPAT_VERSION: release-2.32.66
  FNA3D_VERSION: 26.04
  DOTNET_RUNTIME_VERSION: v10.0.3
  MONO_VERSION: main
  DOTNET_SDK_VERSION: '10.0.x'

on: 
  push:
    branches: 
      - master
  workflow_dispatch:
      
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build SDL3, SDL2, FNA natives, OpenSSL
    steps:
      - name: Check out source
        uses: actions/checkout@v1
      - name: Install NDK 
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt install -y ninja-build cmake llvm lld clang build-essential python-is-python3 curl git lldb libicu-dev liblttng-ust-dev libssl-dev libkrb5-dev pigz cpio spirv-headers patchelf
      - name: lua54
        run: |
          set -euo pipefail
          ABIS=("arm64-v8a" "x86_64")
          API_LEVEL=26
          LUA_VERSION="${LUA_VERSION:-5.4.7}"
          LUA_TARBALL="https://www.lua.org/ftp/lua-$LUA_VERSION.tar.gz"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          ROOT="$(pwd)"
          curl -fsSL "$LUA_TARBALL" -o lua.tar.gz
          tar xzf lua.tar.gz
          rm lua.tar.gz
          mv "lua-$LUA_VERSION" lua-src
          mkdir -p Binaries

          SOURCES=()
          for f in lua-src/src/*.c; do
              base="$(basename "$f")"
              case "$base" in
                  lua.c|luac.c) ;;
                  *) SOURCES+=("$f") ;;
              esac
          done

          for abi in "${ABIS[@]}"; do
              case "$abi" in
                  arm64-v8a)    triple="aarch64-linux-android" ;;
                  x86_64)       triple="x86_64-linux-android" ;;
              esac

              CC="$TOOLCHAIN/bin/${triple}${API_LEVEL}-clang"
              if [[ ! -x "$CC" ]]; then
                  echo "Compiler not found: $CC" >&2
                  exit 2
              fi

              TMP_OUT="$ROOT/lua-src/build-$abi"
              rm -rf "$TMP_OUT"
              mkdir -p "$TMP_OUT"

              "$CC" \
                  -O2 -fPIC -shared \
                  -DLUA_USE_LINUX \
                  -Wl,-soname,liblua54.so \
                  -ldl -lm \
                  -I"$ROOT/lua-src/src" \
                  -o "$TMP_OUT/liblua54.so" \
                  "${SOURCES[@]}"

              cp "$TMP_OUT/liblua54.so" "$ROOT/Binaries/liblua54-$abi.so"
          done
          
      - name: SDL3
        shell: bash
        run: |
          set -euo pipefail
          ABIS=("arm64-v8a" "x86_64")
          API_LEVEL=26
          TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          git clone --depth 1 -b ${{ env.SDL_VERSION }} https://github.com/libsdl-org/SDL sdl3-src
          mkdir -p Binaries sdl3
          for abi in "${ABIS[@]}"; do
              BUILD_DIR="build-sdl3-$abi"
              PREFIX="$(pwd)/sdl3/$abi"
              rm -rf "$BUILD_DIR"
              cmake -S sdl3-src -B "$BUILD_DIR" \
                  -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
                  -DANDROID_ABI="$abi" \
                  -DANDROID_PLATFORM=android-$API_LEVEL \
                  -DSDL_SHARED=ON \
                  -DSDL_STATIC=OFF \
                  -DSDL_TEST_LIBRARY=OFF \
                  -DSDL_TESTS=OFF \
                  -DSDL_INSTALL_TESTS=OFF \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                  -GNinja
              cmake --build "$BUILD_DIR" -j
              cmake --install "$BUILD_DIR"
              cp "$PREFIX/lib/libSDL3.so" "Binaries/libSDL3-$abi.so"
              patchelf --set-soname libSDL3.so "Binaries/libSDL3-$abi.so"
          done

          JAR="$(find sdl3 -maxdepth 5 -name 'SDL3-*.jar' -type f | head -n1)"
          if [[ -n "$JAR" ]]; then
              cp "$JAR" Binaries/SDL3.jar
          else
              echo "ERROR: SDL3 jar not produced by install step" >&2
              find sdl3 -maxdepth 5 -name '*.jar' -type f
              exit 1
          fi
      - name: SDL2 (sdl2-compat)
        shell: bash
        run: |
          set -euo pipefail
          ABIS=("arm64-v8a" "x86_64")
          API_LEVEL=26
          TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          git clone --depth 1 -b ${{ env.SDL2COMPAT_VERSION }} https://github.com/libsdl-org/sdl2-compat sdl2compat-src
          for abi in "${ABIS[@]}"; do
              BUILD_DIR="build-sdl2compat-$abi"
              SDL3_PREFIX="$(pwd)/sdl3/$abi"
              rm -rf "$BUILD_DIR"
              cmake -S sdl2compat-src -B "$BUILD_DIR" \
                  -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
                  -DANDROID_ABI="$abi" \
                  -DANDROID_PLATFORM=android-$API_LEVEL \
                  -DSDL3_DIR="$SDL3_PREFIX/lib/cmake/SDL3" \
                  -DSDL2COMPAT_TESTS=OFF \
                  -DSDL2COMPAT_INSTALL_CPACK=OFF \
                  -DSDL2COMPAT_TRY_X11=OFF \
                  -DSDL2COMPAT_TRY_WAYLAND=OFF \
                  -DCMAKE_DISABLE_FIND_PACKAGE_X11=TRUE \
                  -DCMAKE_DISABLE_FIND_PACKAGE_Wayland=TRUE \
                  -DCMAKE_POLICY_VERSION_MINIMUM=3.10 \
                  -DCMAKE_BUILD_TYPE=Release \
                  -GNinja
              cmake --build "$BUILD_DIR" -j
              SRC_LIB="$(find "$BUILD_DIR" -maxdepth 2 \
                  \( -name 'libSDL2-2.0.so*' -o -name 'libSDL2.so*' \) \
                  -type f | head -n1)"
              if [[ -z "$SRC_LIB" ]]; then
                  echo "ERROR: sdl2-compat produced no .so for $abi" >&2
                  find "$BUILD_DIR" -maxdepth 2 -name 'libSDL2*' >&2
                  exit 1
              fi
              cp "$SRC_LIB" "Binaries/libSDL2-$abi.so"
              patchelf --set-soname libSDL2.so "Binaries/libSDL2-$abi.so"
          done
      - name: FNA3D
        shell: bash
        run: |
          ABIS=("arm64-v8a" "x86_64")
          API_LEVEL=26
          TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          git clone --recursive --depth 1 -b ${{ env.FNA3D_VERSION }} https://github.com/FNA-XNA/FNA3D fna3d-src
          for abi in "${ABIS[@]}"; do
              BUILD_DIR="build-fna3d-$abi"
              SDL3_PREFIX="$(pwd)/sdl3/$abi"
              rm -rf "$BUILD_DIR"
              cmake -S fna3d-src -B "$BUILD_DIR" \
                  -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
                  -DANDROID_ABI="$abi" \
                  -DANDROID_PLATFORM=android-$API_LEVEL \
                  -DANDROID_STL=c++_static \
                  -DBUILD_SHARED_LIBS=ON \
                  -DBUILD_SDL3=ON \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DSDL3_DIR="$SDL3_PREFIX/lib/cmake/SDL3" \
                  -DCMAKE_C_FLAGS="-DGL_GLEXT_PROTOTYPES -O3" \
                  -GNinja
              cmake --build "$BUILD_DIR" --target FNA3D -j
              # CMake may emit libFNA3D.so or versioned variants depending
              # on the upstream config. Pick the file (not a symlink) and
              # strip its SONAME for the same reason as SDL3.
              SRC_LIB="$(find "$BUILD_DIR" -maxdepth 2 -name 'libFNA3D.so*' -type f | head -n1)"
              if [[ -z "$SRC_LIB" ]]; then
                  echo "ERROR: FNA3D produced no .so for $abi" >&2
                  exit 1
              fi
              cp "$SRC_LIB" "Binaries/libFNA3D-$abi.so"
              patchelf --set-soname libFNA3D.so "Binaries/libFNA3D-$abi.so"
          done
      - name: Archive Native Libs
        uses: actions/upload-artifact@master
        with:
          name: Android-natives
          path: Binaries/

  build-dotnet:
    runs-on: ubuntu-latest
    name: Build dotnet
    steps:
      - name: Check out source
        uses: actions/checkout@v1
      - name: Install NDK 
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt install -y ninja-build cmake llvm lld clang build-essential python-is-python3 curl git lldb libicu-dev liblttng-ust-dev libssl-dev libkrb5-dev pigz cpio spirv-headers ripgrep
      - name: build dotnet
        shell: bash
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          mkdir -p Staging
          git clone -b ${{ env.DOTNET_RUNTIME_VERSION }} --depth=1 https://github.com/dotnet/runtime
          cd runtime/

          # keep order correct
          git apply ../dotnet-gettypes-rtle.patch
          git apply ../dotnet-nuke-security.patch
          git apply ../dotnet-static-init.patch
          git apply ../dotnet-relax-typeload.patch
          git apply ../dotnet-static-init-sflda-bfi.patch
          git apply ../dotnet-static-init-jit-exit.patch

          ABIS=(arm64 x64)
          for abi in "${ABIS[@]}"; do
            rid="android-$abi"
            ./build.sh \
              --os android \
              --arch "$abi" \
              --configuration Release \
              --subset mono+libs \
              /p:KeepNativeSymbols=true

            src=""
            for cand in \
              "./artifacts/bin/microsoft.netcore.app.runtime.$rid/Release/runtimes/$rid/native" \
              "./artifacts/bin/microsoft.netcore.app.runtime.mono.$rid/Release/runtimes/$rid/native" \
              "./artifacts/packages/Release/Microsoft.NETCore.App.Runtime.$rid/runtimes/$rid/native" \
              "./artifacts/packages/Release/Microsoft.NETCore.App.Runtime.Mono.$rid/runtimes/$rid/native" \
            ; do
              if [[ -d "$cand" ]]; then src="$cand"; break; fi
            done
            if [[ -z "$src" ]]; then
              echo "ERROR: couldn't find native artifacts for $rid" >&2
              find ./artifacts -maxdepth 5 -type d -name native | head -10
              exit 1
            fi

            mkdir -p "../Staging/$rid/native"
            cp -a "$src/." "../Staging/$rid/native/"
          done

          cd ..
          mkdir -p Binaries
          ( cd Staging && zip -qr ../Binaries/dotnet-runtime-android.zip . )
          ls -la Binaries/
      - name: Archive Dotnet
        uses: actions/upload-artifact@master
        with:
          name: Android-dotnet
          path: Binaries/

  release:
    runs-on: ubuntu-latest
    needs: [build, build-dotnet]
    name: Create Release
    steps:
      - name: Generate Release Name
        run: echo RELEASE_NAME=$(uuidgen) >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Organize binaries for release
        run: |
          mkdir release_assets
          find artifacts/ -type f | while read file; do
            cp "$file" release_assets/
          done
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: 'FNALibs Android ${{ env.RELEASE_NAME }}'
          body: 'These are the FNA libs build for Android'
          commit: ${{ github.ref_name }}
          tag: ${{ env.RELEASE_NAME }}
          removeArtifacts: true
          artifacts: "release_assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
