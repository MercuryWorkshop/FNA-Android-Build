on: 
  push:
    branches: 
      - master
  workflow_dispatch:
      
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build SDL3, SDL2, FNA natives, OpenSSL
    steps:
      - name: Check out source
        uses: actions/checkout@v1
      - name: Install NDK 
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt install -y ninja-build cmake llvm lld clang build-essential python-is-python3 curl git lldb libicu-dev liblttng-ust-dev libssl-dev libkrb5-dev pigz cpio spirv-headers
      - name: lua54
        run: |
          ABIS=("arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          API_LEVEL=26
          LUA_VERSION="${LUA_VERSION:-5.4.7}"
          LUA_TARBALL="https://www.lua.org/ftp/lua-$LUA_VERSION.tar.gz"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          curl -fsSL "$LUA_TARBALL" -o lua.tar.gz
          tar xzf lua.tar.gz
          rm lua.tar.gz
          mv "lua-$LUA_VERSION" lua-src
          mkdir -p Binaries
                    
          for abi in "${ABIS[@]}"; do
              case "$abi" in
                  arm64-v8a)    triple="aarch64-linux-android" ;;
                  armeabi-v7a)  triple="armv7a-linux-androideabi" ;;
                  x86)          triple="i686-linux-android" ;;
                  x86_64)       triple="x86_64-linux-android" ;;
              esac
          
              CC="$TOOLCHAIN/bin/${triple}${API_LEVEL}-clang"
              if [[ ! -x "$CC" ]]; then
                  echo "Compiler not found: $CC" >&2
                  exit 2
              fi
              
              cd "lua-src/src"
              SOURCES=()
              for f in *.c; do
                  case "$f" in
                      lua.c|luac.c) ;; 
                      *) SOURCES+=("$f") ;;
                  esac
              done
          
              TMP_OUT="../build-$abi"
              rm -rf "$TMP_OUT"
              mkdir -p "$TMP_OUT"
          
              "$CC" \
                  -O2 -fPIC -shared \
                  -DLUA_USE_LINUX -DLUA_USE_POSIX -DLUA_USE_DLOPEN \
                  -Wl,-soname,liblua54.so \
                  -ldl -lm \
                  -o "$TMP_OUT/liblua54.so" \
                  "${SOURCES[@]}"
          
              cp "$TMP_OUT/liblua54.so" "../../Binaries/liblua54-$abi.so"
          done
          
