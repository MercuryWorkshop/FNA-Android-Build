  build-dotnet:
    runs-on: ubuntu-latest
    name: Build dotnet
    steps:
      - name: Check out source
        uses: actions/checkout@v1
      - name: Install NDK 
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt install -y ninja-build cmake llvm lld clang build-essential python-is-python3 curl git lldb libicu-dev liblttng-ust-dev libssl-dev libkrb5-dev pigz cpio spirv-headers ripgrep
      - name: build dotnet
        shell: bash
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          mkdir -p Staging
          git clone -b ${{ env.DOTNET_RUNTIME_VERSION }} --depth=1 https://github.com/dotnet/runtime
          cd runtime/

          # Order matters: dotnet-static-init.patch defines the BFI
          # cctor gate; the *-sflda-bfi and *-jit-exit addenda close
          # the JIT-side call sites the upstream patch missed (only
          # the WASM interp paths were covered upstream).
          git apply ../dotnet-static-init.patch
          git apply ../dotnet-relax-typeload.patch
          git apply ../dotnet-static-init-sflda-bfi.patch
          git apply ../dotnet-static-init-jit-exit.patch

          ABIS=(arm64 x64)
          for abi in "${ABIS[@]}"; do
            rid="android-$abi"
            ./build.sh \
              --os android \
              --arch "$abi" \
              --configuration Release \
              --subset mono+libs \
              /p:KeepNativeSymbols=true

            src=""
            for cand in \
              "./artifacts/bin/microsoft.netcore.app.runtime.$rid/Release/runtimes/$rid/native" \
              "./artifacts/bin/microsoft.netcore.app.runtime.mono.$rid/Release/runtimes/$rid/native" \
              "./artifacts/packages/Release/Microsoft.NETCore.App.Runtime.$rid/runtimes/$rid/native" \
              "./artifacts/packages/Release/Microsoft.NETCore.App.Runtime.Mono.$rid/runtimes/$rid/native" \
            ; do
              if [[ -d "$cand" ]]; then src="$cand"; break; fi
            done
            if [[ -z "$src" ]]; then
              echo "ERROR: couldn't find native artifacts for $rid" >&2
              find ./artifacts -maxdepth 5 -type d -name native | head -10
              exit 1
            fi

            mkdir -p "../Staging/$rid/native"
            cp -a "$src/." "../Staging/$rid/native/"
          done

          cd ..
          mkdir -p Binaries
          ( cd Staging && zip -qr ../Binaries/dotnet-runtime-android.zip . )
          ls -la Binaries/
      - name: Archive Dotnet
        uses: actions/upload-artifact@master
        with:
          name: Android-dotnet
          path: Binaries/

  release:
    runs-on: ubuntu-latest
    needs: [build, build-dotnet]
    name: Create Release
    steps:
      - name: Generate Release Name
        run: echo RELEASE_NAME=$(uuidgen) >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Organize binaries for release
        run: |
          mkdir release_assets
          find artifacts/ -type f | while read file; do
            cp "$file" release_assets/
          done
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: 'FNALibs Android ${{ env.RELEASE_NAME }}'
          body: 'These are the FNA libs build for Android'
          commit: ${{ github.ref_name }}
          tag: ${{ env.RELEASE_NAME }}
          removeArtifacts: true
          artifacts: "release_assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
